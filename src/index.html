<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CTRL</title>
<link rel="stylesheet" href="assets/tabler-icons.css" />
<link rel="stylesheet" href="assets/xterm.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <!-- TOPBAR -->
  <div id="topbar" data-tauri-drag-region>
    <span class="logo">&gt;_ CTRL</span>
    <div id="search-wrap">
      <span class="prompt">&gt;</span>
      <input id="global-search" type="text" placeholder="Search… (Ctrl+K)" autocomplete="off" spellcheck="false" />
      <div id="search-results"></div>
    </div>
    <div class="win-controls">
      <button class="win-btn" id="btn-min" title="Minimise"><i class="ti ti-minus"></i></button>
      <button class="win-btn" id="btn-max" title="Maximise"><i class="ti ti-square"></i></button>
      <button class="win-btn close" id="btn-close" title="Close"><i class="ti ti-x"></i></button>
    </div>
  </div>

  <div id="body">
    <!-- SIDEBAR -->
    <nav id="sidebar">
      <button class="nav-btn active" data-pane="dash">    <i class="ti ti-home"></i>              <span class="tip">Dashboard</span></button>
      <button class="nav-btn"        data-pane="fixes">   <i class="ti ti-bolt"></i>              <span class="tip">Quick Fixes</span></button>
      <button class="nav-btn"        data-pane="scripts"> <i class="ti ti-code"></i>              <span class="tip">Scripts</span></button>
      <button class="nav-btn"        data-pane="builder"> <i class="ti ti-wand"></i>              <span class="tip">Builder</span></button>
      <button class="nav-btn"        data-pane="tools">   <i class="ti ti-tool"></i>              <span class="tip">Tools</span></button>
      <button class="nav-btn"        data-pane="projects"><i class="ti ti-archive"></i>           <span class="tip">Projects</span></button>
      <div class="nav-divider"></div>
      <button class="nav-btn"        data-pane="workflows"><i class="ti ti-player-play"></i>      <span class="tip">Workflows</span></button>
      <button class="nav-btn"        data-pane="backup">  <i class="ti ti-device-floppy"></i>    <span class="tip">Backup</span></button>
      <button class="nav-btn"        data-pane="tweaks">  <i class="ti ti-adjustments"></i>      <span class="tip">Tweaks</span></button>
      <button class="nav-btn"        data-pane="env">    <i class="ti ti-list-details"></i>     <span class="tip">Environment</span></button>
      <button class="nav-btn"        data-pane="snippets"><i class="ti ti-blockquote"></i>        <span class="tip">Snippets</span></button>
      <button class="nav-btn"        data-pane="terminal"><i class="ti ti-terminal-2"></i>        <span class="tip">Terminal</span></button>
      <div class="nav-spacer"></div>
      <button class="nav-btn"        data-pane="activity"><i class="ti ti-history"></i>           <span class="tip">Recent Activity</span></button>
      <button class="nav-btn"        data-pane="settings"><i class="ti ti-settings"></i>         <span class="tip">Settings</span></button>
    </nav>

    <!-- CONTENT -->
    <div id="content">

      <!-- DASHBOARD -->
      <div class="pane active" id="dash-pane">
        <div class="pane-scroll" id="dash-scroll"></div>
        <div id="dash-perf">
          <div id="perf-header">
            <i class="ti ti-activity perf-icon"></i>
            <span id="perf-title-text">Live</span>
            <button class="perf-collapse-btn" id="perf-toggle" title="Collapse"><i class="ti ti-chevron-right" id="perf-chevron"></i></button>
          </div>
          <div id="perf-body"></div>
        </div>
      </div>

      <!-- QUICK FIXES -->
      <div class="pane" id="fixes-pane">
        <div class="pane-scroll" id="fixes-scroll"></div>
      </div>

      <!-- SCRIPTS -->
      <div class="pane" id="scripts-pane">
        <div class="pane-scroll" id="scripts-scroll"></div>
      </div>

      <!-- BUILDER -->
      <div class="pane" id="builder-pane">
        <div id="builder-nav">
          <div id="builder-nav-items"></div>
          <div class="bnav-spacer"></div>
          <button class="bnav-item bnav-run" id="builder-run-tab">
            <i class="ti ti-player-play"></i>
            <span class="bnav-label">Run Script</span>
            <span class="bnav-count" id="builder-sel-badge">0</span>
          </button>
        </div>
        <div id="builder-content">
          <div id="builder-cat-header">
            <span id="builder-cat-title">Select a category</span>
            <span class="sel-chip" id="builder-sel-chip">0 selected</span>
            <button class="clear-tab-btn" id="builder-clear-tab" title="Clear All"><i class="ti ti-x"></i> Clear All</button>
          </div>
          <div id="builder-toggles"></div>
          <div id="builder-script-view">
            <div id="builder-presets">
              <span class="preset-label">Presets</span>
              <button class="preset-btn" data-preset="basic">
                <i class="ti ti-shield-check"></i>
                <div><strong>Basic</strong><span>Safe cleanup &amp; light debloat</span></div>
              </button>
              <button class="preset-btn" data-preset="strict">
                <i class="ti ti-shield-lock"></i>
                <div><strong>Strict</strong><span>Full privacy &amp; deeper debloat</span></div>
              </button>
              <button class="preset-btn" data-preset="extreme">
                <i class="ti ti-shield-x"></i>
                <div><strong>Extreme</strong><span>Maximum privacy, removes more</span></div>
              </button>
              <div style="flex:1"></div>
              <button class="action-btn btn-ghost" id="builder-clear" style="margin-left:8px"><i class="ti ti-x"></i> Clear All</button>
            </div>
            <div id="builder-toolbar">
              <span id="sel-count">0 selected</span>
            </div>
            <div id="builder-code-wrap">
              <div id="builder-code"><span class="ps-comment"># Select actions from the categories on the left.</span></div>
            </div>
            <div id="builder-footer">
              <input id="save-name" type="text" placeholder="Script name…" autocomplete="off" />
              <button class="action-btn btn-secondary" id="builder-copy"><i class="ti ti-copy"></i> Copy</button>
              <button class="action-btn btn-ghost"     id="builder-save"><i class="ti ti-device-floppy"></i> Save</button>
              <button class="action-btn btn-primary"   id="builder-run"><i class="ti ti-player-play"></i> Run</button>
            </div>
          </div>
        </div>
      </div>

      <!-- TOOLS -->
      <div class="pane" id="tools-pane">
        <div class="pane-scroll" id="tools-scroll"></div>
      </div>

      <!-- PROJECTS -->
      <div class="pane" id="projects-pane">
        <div class="pane-scroll" id="projects-scroll"></div>
      </div>

      <!-- WORKFLOWS -->
      <div class="pane" id="workflows-pane">
        <div class="pane-scroll" id="workflows-scroll"></div>
      </div>

      <!-- BACKUP -->
      <div class="pane" id="backup-pane">
        <div class="pane-scroll" id="backup-scroll"></div>
      </div>

      <!-- TWEAKS -->
      <div class="pane" id="tweaks-pane">
        <div class="pane-scroll" id="tweaks-scroll"></div>
      </div>

      <!-- ENVIRONMENT VARIABLES -->
      <div class="pane" id="env-pane">
        <div class="pane-scroll" id="env-scroll"></div>
      </div>

      <!-- SNIPPETS -->
      <div class="pane" id="snippets-pane">
        <div class="pane-scroll" id="snippets-scroll"></div>
      </div>

      <!-- TERMINAL -->
      <div class="pane" id="terminal-pane">
        <div id="term-toolbar">
          <span id="term-shell-label">PowerShell</span>
          <div class="term-shell-btns">
            <button class="term-shell-opt" id="term-shell-ps"  title="PowerShell">PS</button>
            <button class="term-shell-opt" id="term-shell-cmd" title="Command Prompt">CMD</button>
          </div>
          <div class="term-spacer"></div>
          <button class="action-btn btn-ghost"    id="term-btn-clear" title="Clear screen">Clear</button>
          <button class="action-btn btn-ghost"    id="term-btn-kill"  title="Kill process" disabled>Kill</button>
          <button class="action-btn btn-secondary" id="term-btn-start" title="Start shell">Start</button>
          <button class="action-btn btn-danger"   id="term-btn-admin" title="Open elevated PowerShell (UAC prompt)"><i class="ti ti-shield"></i> Admin</button>
        </div>
        <div id="term-wrap"></div>
      </div>

      <!-- RECENT ACTIVITY -->
      <div class="pane" id="activity-pane">
        <div class="pane-scroll" id="activity-scroll"></div>
      </div>

      <!-- SETTINGS -->
      <div class="pane" id="settings-pane">
        <div class="pane-scroll" id="settings-scroll"></div>
      </div>

      <!-- OUTPUT DRAWER — always visible, click header to expand -->
      <div id="output-drawer">
        <div id="output-header">
          <i class="ti ti-terminal" style="font-size:13px;color:var(--text3)"></i>
          <span class="output-title">output</span>
          <span id="output-new-dot" style="display:none"></span>
          <span id="output-ts"></span>
          <button id="output-clear">clear</button>
          <button id="output-copy">copy</button>
          <button class="icon-btn" id="output-toggle" title="Toggle output"><i class="ti ti-chevron-up"></i></button>
        </div>
        <div id="output-body">
          <div id="output-text"></div>
        </div>
      </div>

    </div><!-- #content -->
  </div><!-- #body -->
</div><!-- #app -->

<!-- MODAL -->
<div id="modal-overlay">
  <div class="modal" id="modal-box">
    <div class="modal-header">
      <div class="modal-title" id="modal-title"></div>
      <button class="modal-close" id="modal-x" title="Close (Esc)"><i class="ti ti-x"></i></button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<!-- CONTEXT MENU -->
<div id="ctx-menu"></div>

<!-- TOAST -->
<div id="toast">
  <i class="ti toast-icon"></i>
  <span class="toast-msg"></span>
  <div class="toast-bar"></div>
</div>

<script src="assets/xterm.js"></script>
<script src="assets/xterm-addon-fit.js"></script>
<script src="app.js" type="module"></script>
</body>
</html>
