name: Enhancement Proposal
description: A specific, scoped improvement to existing behavior (not a whole new feature)
title: "[Enhancement]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For "add X new module" use Feature Request instead. This is for "Y already exists, but it should work like Z".

  - type: input
    id: area
    attributes:
      label: Area
      placeholder: e.g. Scripts pane drag-reorder, Dashboard compact mode
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Current behavior
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed behavior
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why this is better
      description: What does it unblock, or what friction does it remove?
