[package]
name = "ctrl"
version = "0.1.0"
description = "CTRL — personal control centre"
authors = []
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ctrl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ctrl-cli"
path = "src/bin/ctrl_cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
